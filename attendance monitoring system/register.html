<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Registration</title>

    <link rel="stylesheet" href="/register.css">

</head>


<body>


    <!-- REGISTRATION CONTAINER -->

    <div class="auth-container">


        <!-- REGISTRATION CARD -->

        <div class="auth-card">


            <h1>
                Admin Registration
            </h1>


            <p class="subtitle">
                Create an admin account
            </p>


            <!-- MESSAGE -->

            <div
                id="registerMessage"
                class="message"
                style="display: none;"
            >
            </div>


            <!-- REGISTRATION FORM -->

            <form id="registerForm">


                <!-- GMAIL -->

                <label for="registerUsername">
                    Username 
                </label>


                <input
                    type="email"
                    id="registerUsername"
                    name="username"
                    placeholder="Enter your Username"
                    autocomplete="off"
                    title="Please enter a valid Username"
                    required
                >


                <!-- PASSWORD -->

                <label for="registerPassword">
                    Password
                </label>


                <div class="password-box">


                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create 6-digit password"
                        maxlength="6"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        title="Password must contain exactly 6 digits"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword(
                            'registerPassword',
                            this
                        )"
                    >
                        Show
                    </button>


                </div>


                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword">
                    Confirm Password
                </label>


                <div class="password-box">


                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Repeat 6-digit password"
                        maxlength="6"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        title="Password must contain exactly 6 digits"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword(
                            'confirmPassword',
                            this
                        )"
                    >
                        Show
                    </button>


                </div>


                <!-- REGISTER BUTTON -->

                <button
                    class="main-button"
                    type="submit"
                >
                    Register
                </button>


            </form>


            <!-- LOGIN LINK -->

            <p class="switch-text">

                Already have an account?

                <a href="/login">
                    Log In
                </a>

            </p>


        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script src="/script.js"></script>


</body>

</html>
